[project]
name = "semantix-backend"
version = "0.1.0"
description = "Backend for Semantix.io"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sentence-transformers",
    "redis",
    "sqlalchemy",
    "asyncpg",
    "websockets",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
